name: play-smoke
# Play mode (docs/HOST.md "Play mode"): the one-command script users run to play the real game, unattended for a few
# seconds per variant (host/electron/scripts/play-world.sh --play-seconds): the world starts on the real clock, the
# drawable follows a window resize, a click gets pointer lock, W moves the player, full screen and back.
# Its own workflow (not a job of mac.yml): it only runs when play mode's files change, and it must not wait in
# mac.yml's queue, where a later push replaces the waiting run. Never gates anything: the PASS / FAIL lines are
# annotations, the logs, the JSON and a screencapture are in the artifact.
# !!! The runner's GPU is paravirtual and its display 1x: fps is not an Air's, and the Retina path is not covered.
on:
  push:
    branches: [claude/focused-keller-jtmxe0]
    paths:
      - host/electron/game/main.js
      - host/electron/game/boot.mjs
      - host/electron/game/preload.js
      - host/electron/game/play/**
      - host/electron/scripts/play-world.sh
      - host/electron/scripts/bundle-game.mjs
      - host/electron/scripts/world-game.sh
      - host/electron/native/src/**
      - host/electron/host.js
      - js/three-programs.js
      - js/fastrender-three.js
      - src/hitch.rs
      - src/mac_programs.rs
      - src/mac_three.rs
      - src/pipeline_manifest.rs
      - patches/**
      - .github/workflows/play-smoke.yml
  workflow_dispatch:
concurrency:
  group: play-smoke-${{ github.ref }}
  # a started run finishes (the door numbers of each push are wanted); a waiting one is replaced by the newest push
  cancel-in-progress: false
jobs:
  play-smoke:
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: play-smoke - fastrender (PARAVIRTUAL GPU - fps is not an Air's)
        id: fr
        continue-on-error: true
        timeout-minutes: 40
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string
          # --doors 2: after the checks, in and out of the two nearest shops through the game's enter() / goBack()
          rc=0; bash host/electron/scripts/play-world.sh --fps --play-seconds 15 --doors 2 --out "$GITHUB_WORKSPACE/play-out" --log "$GITHUB_WORKSPACE/play-out/play-fastrender-stall.log" --timeout 900 > play-fastrender.log 2>&1 || rc=$?
          echo "play-world.sh exit $rc"; echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo "exit $rc"; grep -E "^\[game\] (PASS|FAIL|FATAL|play|window|DONE|DOOR)|^\[fastrender\] (renderer|compile)|pointer lock|mouse is not|MISSING|Assertion|signal|^== " play-fastrender.log | cut -c1-900; } > play-fastrender-summary.txt
          bash .github/annotate.sh notice "play-smoke fastrender (exit $rc)" play-fastrender-summary.txt 40
          # the stall log: what each door leg cost, the summary, and the longest frames with their cause
          { grep -E "^\[game\] DOOR|^\[summary\]" play-fastrender.log | cut -c1-600; echo "-- the 12 longest frames:"; grep -E "^\[hitch\]" play-fastrender.log | sed -E 's/^\[hitch\] [0-9:.]+ frame ([0-9.]+) ms/\1 &/' | sort -rn | head -12 | cut -d' ' -f2- | cut -c1-900; echo "-- scripts the page could not load, unhandled rejections:"; grep -cE "missing script|non-JavaScript MIME|unhandled rejection" play-fastrender.log || true; grep -E "missing script|non-JavaScript MIME|unhandled rejection" play-fastrender.log | head -5 | cut -c1-300 || true; } > play-fastrender-stall.txt
          bash .github/annotate.sh notice "play-smoke fastrender stall log: doors (PARAVIRTUAL GPU)" play-fastrender-stall.txt 60
          grep -v "ERR_FAILED\|ERR_BLOCKED\|Security Policy\|Fetch API cannot" play-fastrender.log | tail -80
      # the same door legs as it was before dynamicLights: trimLights (the light counts step at a door, every lit
      # program is replaced) with the main pass waiting for every replacement pipeline (FASTRENDER_MAIN_WAIT_MS=0),
      # then with the wait cut at 100 ms a frame (the default now). The hitch the stall log was made for.
      - name: play-smoke - fastrender, doors with dynamicLights off (the light-count step at a door; waits unbounded, then cut)
        if: ${{ always() && steps.fr.outputs.rc == '0' }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          for w in 0 100; do
            rc=0; FASTRENDER_MAIN_WAIT_MS=$w bash host/electron/scripts/play-world.sh --no-build --play-seconds 5 --doors 2 --params '{"dynamicLights":0}' --tag "play-fr-trimlights-$w" --out "$GITHUB_WORKSPACE/play-out" --log "$GITHUB_WORKSPACE/play-out/play-fastrender-trimlights-$w-stall.log" --timeout 900 > "play-fr-trimlights-$w.log" 2>&1 || rc=$?
            { echo "exit $rc"; grep -E "^\[game\] DOOR|^\[summary\]|^\[fastrender\] compile" "play-fr-trimlights-$w.log" | cut -c1-900; echo "-- the 12 longest frames:"; grep -E "^\[hitch\]" "play-fr-trimlights-$w.log" | sed -E 's/^\[hitch\] [0-9:.]+ frame ([0-9.]+) ms/\1 &/' | sort -rn | head -12 | cut -d' ' -f2- | cut -c1-900; } > play-fr-trimlights-stall.txt || true
            bash .github/annotate.sh notice "play-smoke fastrender stall log: doors with dynamicLights OFF, main-pass wait limit $w ms (0 = none: as before) (PARAVIRTUAL GPU)" play-fr-trimlights-stall.txt 60
          done
      # which of play mode's differences from the golden run the failure depends on (the runner's paravirtual GPU
      # driver has its own assertions: a crash here need not be one on real hardware)
      - name: play-smoke - fastrender again, one change at a time (only when the run above failed)
        if: ${{ always() && steps.fr.outputs.rc != '0' }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          try() { name=$1; shift; rc=0; "$@" --tag "play-fr-$name" > "play-fr-$name.log" 2>&1 || rc=$?; { echo "exit $rc"; grep -E "^\[game\] (PASS|FAIL|FATAL|DONE)|Assertion|signal|failed assertion" "play-fr-$name.log" | cut -c1-400; } > play-try.txt; bash .github/annotate.sh notice "play-smoke fastrender, $name (exit $rc)" play-try.txt 20; echo "== $name"; cat play-try.txt; }
          P="bash host/electron/scripts/play-world.sh --no-build --play-seconds 5 --out $GITHUB_WORKSPACE/play-out --timeout 300"
          try again $P
          try golden-params $P --search '?mode=world&quality=low&weather=clear&tod=noon&seamless=0'
          try vsync-off $P --renderer '{"vsync":0}'
          try frameless $P --frame off
          try fixed-size $P --size 800x500
          try validation env MTL_DEBUG_LAYER=1 MTL_DEBUG_LAYER_ERROR_MODE=nslog $P
      - name: play-smoke - the same game copy on stock WebGLRenderer, second run of the script (nothing to rebuild)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          rc=0; bash host/electron/scripts/play-world.sh --webgl --fps --play-seconds 10 --doors 2 --out "$GITHUB_WORKSPACE/play-out" --log "$GITHUB_WORKSPACE/play-out/play-webgl-stall.log" --timeout 600 > play-webgl.log 2>&1 || rc=$?
          echo "play-world.sh exit $rc"
          { echo "exit $rc"; grep -E "^\[game\] (PASS|FAIL|FATAL|play|window|DONE|DOOR)|^\[summary\]|pointer lock|mouse is not|MISSING|^== " play-webgl.log | cut -c1-900; } > play-webgl-summary.txt
          bash .github/annotate.sh notice "play-smoke webgl (exit $rc)" play-webgl-summary.txt 40
          grep -v "ERR_FAILED\|ERR_BLOCKED\|Security Policy\|Fetch API cannot" play-webgl.log | tail -60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: play-smoke
          path: |
            play-out/
            play-*.log
