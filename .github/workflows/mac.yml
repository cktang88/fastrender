name: mac
on: [push, workflow_dispatch]
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers; sysctl -n machdep.cpu.brand_string
      - name: unit tests (portable core) + JS tests (real three.js)
        run: |
          brew install glslang spirv-cross   # CLIs for the JS tests' reference layouts (the app embeds both as libraries)
          cargo test --release
          (cd js && npm ci --silent && npm test)
          node js/build.mjs js/examples/three-city.entry.mjs js/dist/three-city.js
      - name: build
        run: cargo build --release
      - name: offline shader compile (Apple metal compiler)
        run: xcrun -sdk macosx metal -std=metal3.0 -c shaders/fastrender.metal -o /tmp/fr.air
      - name: auto-translated three.js shaders compile with Apple's Metal compiler
        run: for f in js/shader-port/samples/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air && echo "ok $f"; done
      - name: in-process translator (src/xlat.rs, embedded glslang + SPIRV-Cross) output compiles with Apple's Metal compiler
        run: |
          ./target/release/fastrender xlat-dump tests/fixtures/xlat/programs xlat-out
          for f in xlat-out/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air || exit 1; echo "ok $f"; done
      - name: probe
        run: ./target/release/fastrender probe
      # three.js's own programs (programs: 'three', protocol v3). Step names say what passed: the jobs API shows
      # each step's conclusion without needing the logs.
      - name: xlat programs compile (every three-city program, Apple metal compiler)
        if: always()
        run: |
          (cd js && node --import ./test/three-alias.mjs test/dump-programs.mjs ../city-programs)
          ./target/release/fastrender xlat-dump city-programs city-xlat
          for f in city-xlat/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air || exit 1; echo "ok $f"; done
      - name: three-programs frame renders (selftest, Metal API validation)
        if: always()
        env:
          MTL_DEBUG_LAYER: "1"
          FASTRENDER_LOG_PROGRAMS: "1"
        run: |
          set -o pipefail
          ./target/release/fastrender selftest --three js/dist/three-city.js --upscale bilinear --scale 1 --size 640x400 2>&1 | tee three-programs-selftest.txt || true
          bash .github/annotate.sh notice "three-programs selftest" three-programs-selftest.txt 25
          grep -q "three-programs selftest: PASS" three-programs-selftest.txt
          grep "3 frame: output" three-programs-selftest.txt | grep -v "mean rgba = 0 0 0 0"
      - name: selftest
        run: |
          ./target/release/fastrender selftest --path forward --upscale bilinear --scale 1 --size 640x400 --props 20000
          ./target/release/fastrender selftest --path forward --upscale metalfx --scale 0.5 --size 640x400 --props 20000
          # known issue (docs/LOG.md): with GPU shader validation on, the paravirtual device drops
          # the shadow and full-screen draws silently. Kept visible here, not fatal.
          echo "--- shader validation (known paravirtual issue)"; MTL_SHADER_VALIDATION=1 ./target/release/fastrender selftest --path forward --upscale bilinear --scale 1 --size 640x400 --props 20000
      - name: MetalFX temporal (motion-vector pass on the GPU; scaler fallback on the paravirtual GPU)
        # API validation only: GPU shader validation drops draws on the paravirtual device (docs/LOG.md)
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          set -o pipefail
          # 1. the depth-reprojection kernel vs its Rust mirror (core::reproject_motion), known camera move;
          #    exits non-zero on mismatch. Then a full selftest frame through the temporal config.
          ./target/release/fastrender selftest --path forward --upscale temporal --scale 0.5 --size 640x400 --props 20000 | tee temporal-selftest.txt
          grep -q "motion-vector selftest: PASS" temporal-selftest.txt
          # the frame still renders (output not blank)
          grep "3 frame: output" temporal-selftest.txt | grep -v "mean rgba = 0 0 0 0"
          # 2. screenshots with --upscale temporal (city forward, three.js). Where the device lacks the
          #    temporal scaler (this runner) the renderer must say so and fall back to MetalFX spatial.
          ./target/release/fastrender bench --path forward --upscale temporal --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --props 60000 --lights 16 --shot shot-forward-temporal.png | tee temporal-bench.txt
          ./target/release/fastrender bench --three js/dist/three-city.js --upscale temporal --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --shot shot-three-temporal.png > three-temporal.txt 2>&1 || { bash .github/annotate.sh error "three temporal bench" three-temporal.txt 40; exit 1; }
          cat three-temporal.txt | tee -a temporal-bench.txt
          test -s shot-forward-temporal.png && test -s shot-three-temporal.png
          if ./target/release/fastrender probe | grep -q "metalfx_temporal: false"; then
            grep -q "MetalFX temporal scaler not supported on this device: falling back to MetalFX spatial" temporal-bench.txt
            grep -q "MetalFX temporal scaler not supported on this device: falling back to MetalFX spatial" temporal-selftest.txt
            echo "temporal unsupported here: fallback to spatial logged, frames rendered"
          else
            echo "temporal scaler supported: ran MetalFX temporal"
          fi
      - name: API-validation run + screenshots
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          ./target/release/fastrender bench --path forward --upscale metalfx --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --props 60000 --lights 16 --shot shot-forward-metalfx.png
          ./target/release/fastrender bench --path forward --upscale bilinear --scale 1 --size 1280x800 --frames 40 --warmup 5 --props 60000 --shot shot-forward-native.png
          ./target/release/fastrender bench --path deferred --size 1280x800 --frames 40 --warmup 5 --shot shot-deferred.png || true
          ./target/release/fastrender bench --scene voxel --path forward --upscale metalfx --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --lights 16 --shot shot-voxel-metalfx.png
          ./target/release/fastrender bench --scene voxel --path forward --upscale bilinear --scale 1 --size 1280x800 --frames 40 --warmup 5 --shot shot-voxel-native.png
          ./target/release/fastrender bench --three js/dist/three-city.js --upscale metalfx --scale 0.5 --size 1280x800 --frames 60 --warmup 5 --shot shot-three-city.png
          ./target/release/fastrender bench --three js/dist/three-city.js --upscale bilinear --scale 1 --size 1280x800 --frames 60 --warmup 5 --shot shot-three-city-native.png
          ./target/release/fastrender bench --script js/examples/boxes.js --props 20000 --path forward --upscale metalfx --scale 0.5 --size 1280x800 --frames 60 --warmup 5 --shot shot-script.png
      # golden images: native vs the browser three.js r187 reference (same scene/time/size). Both lines print one
      # JSON line and go into the step summary; the last step fails when three's own programs miss the target.
      - name: golden native path (hand-written fs_three, programs native)
        if: always()
        run: |
          set -o pipefail
          ./target/release/fastrender bench --three js/dist/three-city.js --programs native --time 1 --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 2 --shot golden-native-t1.png
          node js/golden/diff.mjs js/golden/ref-t1.png golden-native-t1.png golden-diff-native-t1.png | tee golden-native.json
          echo "golden native path (fs_three): $(cat golden-native.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=golden native path (fs_three)::$(cat golden-native.json)"
      - name: golden three-programs (three.js's own shaders)
        if: always()
        run: |
          set -o pipefail
          rc=0; ./target/release/fastrender bench --three js/dist/three-city.js --programs three --time 1 --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 2 --shot golden-three-t1.png > golden-three-bench.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "golden three-programs bench (exit $rc)" golden-three-bench.txt 30
          [ "$rc" = 0 ]
          node js/golden/diff.mjs js/golden/ref-t1.png golden-three-t1.png golden-diff-three-t1.png | tee golden-three.json
          echo "golden three-programs: $(cat golden-three.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=golden three-programs::$(cat golden-three.json)"
          grep "three frame cost\|three programs:" golden-three-bench.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: golden three-programs MAE<4
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<4?0:1)"
      - name: golden three-programs MAE<2.2
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<2.2?0:1)"
      - name: golden three-programs MAE<1.5
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<1.5?0:1)"
      - name: golden three-programs MAE<1.0
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<1.0?0:1)"
      # parity scene (js/examples/parity-scene.mjs): every shadow-casting light kind (2 directional, spot, point cube),
      # casters through three's own depth programs (alphaTest cut-out, skinned, morphed), flat shading, wireframe, a
      # tangent-less normal map, instancing; and the same with VSMShadowMap (three's VSM blur programs)
      - name: parity scene renders (selftest, Metal API validation)
        if: always()
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          set -o pipefail
          node js/build.mjs js/examples/parity-scene.entry.mjs js/dist/parity.js
          node js/build.mjs js/examples/parity-scene-vsm.entry.mjs js/dist/parity-vsm.js
          node js/build.mjs js/examples/parity-scene-basic.entry.mjs js/dist/parity-basic.js
          rc=0; ./target/release/fastrender selftest --three js/dist/parity.js --upscale bilinear --scale 1 --size 640x400 > parity-selftest.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "parity selftest (exit $rc)" parity-selftest.txt 25
          rc2=0; ./target/release/fastrender selftest --three js/dist/parity-vsm.js --upscale bilinear --scale 1 --size 640x400 > parity-vsm-selftest.txt 2>&1 || rc2=$?
          bash .github/annotate.sh notice "parity VSM selftest (exit $rc2)" parity-vsm-selftest.txt 25
          grep -q "three-programs selftest: PASS" parity-selftest.txt
          rc3=0; ./target/release/fastrender selftest --three js/dist/parity-basic.js --upscale bilinear --scale 1 --size 640x400 > parity-basic-selftest.txt 2>&1 || rc3=$?
          bash .github/annotate.sh notice "parity Basic selftest (exit $rc3)" parity-basic-selftest.txt 25
          grep -q "three-programs selftest: PASS" parity-vsm-selftest.txt
          grep -q "three-programs selftest: PASS" parity-basic-selftest.txt
      - name: golden parity scene (PCF, VSM, Basic shadow maps)
        if: always()
        run: |
          set -o pipefail
          test -s js/dist/parity.js || node js/build.mjs js/examples/parity-scene.entry.mjs js/dist/parity.js
          test -s js/dist/parity-vsm.js || node js/build.mjs js/examples/parity-scene-vsm.entry.mjs js/dist/parity-vsm.js
          test -s js/dist/parity-basic.js || node js/build.mjs js/examples/parity-scene-basic.entry.mjs js/dist/parity-basic.js
          rc=0; ./target/release/fastrender bench --three js/dist/parity.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-parity-t1.png > golden-parity-bench.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "golden parity bench (exit $rc)" golden-parity-bench.txt 20
          rc2=0; ./target/release/fastrender bench --three js/dist/parity-vsm.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-parity-vsm-t1.png > golden-parity-vsm-bench.txt 2>&1 || rc2=$?
          bash .github/annotate.sh notice "golden parity VSM bench (exit $rc2)" golden-parity-vsm-bench.txt 20
          rc3=0; ./target/release/fastrender bench --three js/dist/parity-basic.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-parity-basic-t1.png > golden-parity-basic-bench.txt 2>&1 || rc3=$?
          bash .github/annotate.sh notice "golden parity Basic bench (exit $rc3)" golden-parity-basic-bench.txt 20
          [ "$rc" = 0 ] && [ "$rc2" = 0 ] && [ "$rc3" = 0 ]
          node js/golden/diff.mjs js/golden/ref-parity-t1.png golden-parity-t1.png golden-diff-parity-t1.png | tee golden-parity.json
          node js/golden/diff.mjs js/golden/ref-parity-vsm-t1.png golden-parity-vsm-t1.png golden-diff-parity-vsm-t1.png | tee golden-parity-vsm.json
          node js/golden/diff.mjs js/golden/ref-parity-basic-t1.png golden-parity-basic-t1.png golden-diff-parity-basic-t1.png | tee golden-parity-basic.json
          echo "golden parity: $(cat golden-parity.json), VSM: $(cat golden-parity-vsm.json), Basic: $(cat golden-parity-basic.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=golden parity (Basic)::$(cat golden-parity-basic.json)"
          echo "::notice title=golden parity (PCF)::$(cat golden-parity.json)"
          echo "::notice title=golden parity (VSM)::$(cat golden-parity-vsm.json)"
          grep "three programs:" golden-parity-bench.txt golden-parity-vsm-bench.txt golden-parity-basic-bench.txt >> "$GITHUB_STEP_SUMMARY" || true
      # first run (43694580347): PCF 0.96, VSM 0.84; with every shadow disabled the browser image is 2.51 off
      - name: golden parity MAE<1.5 (PCF, VSM, Basic)
        if: always()
        run: node -e "for(const f of ['golden-parity.json','golden-parity-vsm.json','golden-parity-basic.json']){const r=JSON.parse(require('fs').readFileSync(f,'utf8'));console.log(f,'MAE',r.mae);if(!(r.mae<1.5))process.exit(1)}"
      - name: hypothesis matrix (paravirtual GPU, timings NOT representative)
        run: |
          ./target/release/fastrender matrix --size 1280x800 --frames 60 --warmup 10 --props 60000 --rounds 1
          ./target/release/fastrender voxel-mesh
          ./target/release/fastrender selftest --scene voxel --path forward --upscale metalfx --scale 0.5 --size 640x400
      # Electron host spike (docs/HOST.md "Spike (Nov 2026)"): never blocks the pipeline (continue-on-error),
      # prints PASS/FAIL lines, writes electron-*.png / electron-*-spike.json into the artifact below.
      - name: electron spike - build addon (napi-rs 3) + Electron 45
        id: electron_build
        if: ${{ !cancelled() }}  # independent of the earlier (non-electron) steps
        continue-on-error: true
        working-directory: host/electron
        run: |
          (cd native && RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" cargo test --release) || echo "[spike] FAIL native unit tests"
          npm ci
          npm run build
          node scripts/bundle.mjs
          npm test
          ls -la native/*.node
          npx electron --version
      - name: electron spike - Metal view under transparent web contents (subview stacking)
        if: ${{ !cancelled() && steps.electron_build.outcome == 'success' }}
        continue-on-error: true
        working-directory: host/electron
        run: |
          set -o pipefail
          npx electron app/main.js --frames 120 --out "$GITHUB_WORKSPACE" --tag electron-subview --stack subview 2>&1 | tee "$GITHUB_WORKSPACE/electron-subview.log"
          echo "--- summary"; grep -E '^\[spike\] (PASS|FAIL)' "$GITHUB_WORKSPACE/electron-subview.log" || true
      - name: electron spike - fallback stacking (child NSWindow below a transparent parent)
        if: ${{ !cancelled() && steps.electron_build.outcome == 'success' }}
        continue-on-error: true
        working-directory: host/electron
        run: |
          set -o pipefail
          npx electron app/main.js --frames 60 --out "$GITHUB_WORKSPACE" --tag electron-childwindow --stack childwindow 2>&1 | tee "$GITHUB_WORKSPACE/electron-childwindow.log"
          echo "--- summary"; grep -E '^\[spike\] (PASS|FAIL)' "$GITHUB_WORKSPACE/electron-childwindow.log" || true
      - name: electron spike - direct mode (contextIsolation off, no bridge) for the per-call cost comparison
        if: ${{ !cancelled() && steps.electron_build.outcome == 'success' }}
        continue-on-error: true
        working-directory: host/electron
        run: |
          set -o pipefail
          npx electron app/main.js --frames 120 --out "$GITHUB_WORKSPACE" --tag electron-direct --stack subview --isolation off --no-reload 2>&1 | tee "$GITHUB_WORKSPACE/electron-direct.log"
          echo "--- summary"; grep -E '^\[spike\] (PASS|FAIL)' "$GITHUB_WORKSPACE/electron-direct.log" || true
      # A REAL game (cktang88/3d-world-objects, three r170, unchanged) natively vs its browser golden
      # (docs/notes/real-game-3d-world-objects.md). Non-gating: prints MAE + the per-frame unsupported counts.
      - name: real game 3d-world-objects - native vs browser golden (non-gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if ! git clone --depth 1 https://github.com/cktang88/3d-world-objects ../3d-world-objects > wo-clone.txt 2>&1; then
            echo "game repo not readable from this job: skipped"; bash .github/annotate.sh warning "world-objects: skipped (clone failed)" wo-clone.txt 5; exit 0
          fi
          node js/examples/world-objects.build.mjs ../3d-world-objects js/dist/world-objects.js --target jsc --three three-r170
          rc=0; FASTRENDER_ASSETS="$PWD/../3d-world-objects/public" ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 11 --shot golden-native-world-objects.png > world-objects-bench.txt 2>&1 || rc=$?
          grep -E "world-objects:|three frame cost|three programs:|error|Error" world-objects-bench.txt | cut -c1-1500 | tee world-objects-summary.txt
          bash .github/annotate.sh notice "world-objects bench (exit $rc)" world-objects-summary.txt 20
          grep -v "ERR_FAILED\|fetch blocked" world-objects-bench.txt > world-objects-tail.txt; bash .github/annotate.sh notice "world-objects bench log tail" world-objects-tail.txt 45
          if [ "$rc" != 0 ]; then  # bisect a crash: without the game's files (no models / images), then with a few draws only
            rc2=0; ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 11 > wo-noassets.txt 2>&1 || rc2=$?
            bash .github/annotate.sh notice "world-objects without assets (exit $rc2)" wo-noassets.txt 25
            rc3=0; FASTRENDER_V3_MAX_DRAWS=1 FASTRENDER_ASSETS="$PWD/../3d-world-objects/public" ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 11 > wo-maxdraws.txt 2>&1 || rc3=$?
            bash .github/annotate.sh notice "world-objects 1 draw (exit $rc3)" wo-maxdraws.txt 25
          fi
          node js/golden/diff.mjs js/golden/world-objects-ref.png golden-native-world-objects.png golden-diff-world-objects.png | tee world-objects-golden.json
          echo "::notice title=world-objects golden (MAE vs browser r170)::$(cat world-objects-golden.json)"
          { echo "world-objects golden: $(cat world-objects-golden.json)"; cat world-objects-summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            *.png
            bench-results.json
            electron-*-spike.json
            electron-*.log
