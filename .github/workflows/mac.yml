name: mac
on: [push, workflow_dispatch]
concurrency:
  # Many agents push to this branch and macOS runners are scarce: a newer push supersedes every older run, queued or
  # running. Its run tests all earlier commits too.
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        # Verified 2026-11-15 against actions/runner-images: macos-26 (= macos-latest, macOS 26.7.2) ships Xcode 26.0.1-26.6;
        # there is no macos-27 label yet, the macOS 27.0.1 image is the public-preview `xcode-27` label (Xcode 27.0-27.2).
        include:
          - os: macos-26
            xcode: "26.6"
            experimental: false
          # the macOS 27 preview image (xcode-27) is covered by metal4.yml; dropped here to save scarce runner time
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26   # latest LTS ("Lithium")
      - name: toolchain (Xcode ${{ matrix.xcode }}, Rust from rust-toolchain.toml)
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version; xcrun --sdk macosx --show-sdk-version
          rustup toolchain install   # the channel + target pinned in rust-toolchain.toml
          rustc --version; cargo --version; node --version
      - run: sw_vers; sysctl -n machdep.cpu.brand_string
      - name: unit tests (portable core) + JS tests (real three.js)
        run: |
          brew install glslang spirv-cross   # CLIs for the JS tests' reference layouts (the app embeds both as libraries)
          cargo test --release
          (cd js && npm ci --silent && npm test)
          node js/build.mjs js/examples/three-city.entry.mjs js/dist/three-city.js
      - name: build
        run: cargo build --release
      - name: offline shader compile (Apple metal compiler)
        run: xcrun -sdk macosx metal -std=metal3.0 -c shaders/fastrender.metal -o /tmp/fr.air
      - name: auto-translated three.js shaders compile with Apple's Metal compiler
        run: for f in js/shader-port/samples/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air && echo "ok $f"; done
      - name: in-process translator (src/xlat.rs, embedded glslang + SPIRV-Cross) output compiles with Apple's Metal compiler
        run: |
          ./target/release/fastrender xlat-dump tests/fixtures/xlat/programs xlat-out
          for f in xlat-out/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air || exit 1; echo "ok $f"; done
      - name: probe
        run: |
          ./target/release/fastrender probe | tee probe.txt
          bash .github/annotate.sh notice "probe (${{ matrix.os }})" probe.txt 30
      - name: Metal 4 probe, forced object creation (informational)
        continue-on-error: true
        run: |
          FASTRENDER_PROBE_MTL4_FORCE=1 ./target/release/fastrender probe > probe-metal4-forced.txt 2>&1 || echo "probe exited $?" >> probe-metal4-forced.txt
          grep -E "^metal4|exited" probe-metal4-forced.txt > probe-metal4.txt || true
          cat probe-metal4.txt | tee -a "$GITHUB_STEP_SUMMARY"
          bash .github/annotate.sh notice "Metal 4 probe, forced (${{ matrix.os }})" probe-metal4.txt 20
      # three.js's own programs (programs: 'three', protocol v3). Step names say what passed: the jobs API shows
      # each step's conclusion without needing the logs.
      - name: xlat programs compile (every three-city program, Apple metal compiler)
        if: always()
        run: |
          (cd js && node --import ./test/three-alias.mjs test/dump-programs.mjs ../city-programs)
          ./target/release/fastrender xlat-dump city-programs city-xlat
          for f in city-xlat/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air || exit 1; echo "ok $f"; done
      - name: three-programs frame renders (selftest, Metal API validation)
        if: always()
        env:
          MTL_DEBUG_LAYER: "1"
          FASTRENDER_LOG_PROGRAMS: "1"
        run: |
          set -o pipefail
          ./target/release/fastrender selftest --three js/dist/three-city.js --upscale bilinear --scale 1 --size 640x400 2>&1 | tee three-programs-selftest.txt || true
          bash .github/annotate.sh notice "three-programs selftest" three-programs-selftest.txt 25
          grep -q "three-programs selftest: PASS" three-programs-selftest.txt
          grep "3 frame: output" three-programs-selftest.txt | grep -v "mean rgba = 0 0 0 0"
      - name: selftest
        run: |
          ./target/release/fastrender selftest --path forward --upscale bilinear --scale 1 --size 640x400 --props 20000
          ./target/release/fastrender selftest --path forward --upscale metalfx --scale 0.5 --size 640x400 --props 20000
          # known issue (docs/LOG.md): with GPU shader validation on, the paravirtual device drops
          # the shadow and full-screen draws silently. Kept visible here, not fatal.
          echo "--- shader validation (known paravirtual issue)"; MTL_SHADER_VALIDATION=1 ./target/release/fastrender selftest --path forward --upscale bilinear --scale 1 --size 640x400 --props 20000
      - name: MetalFX temporal (motion-vector pass on the GPU; scaler fallback on the paravirtual GPU)
        # API validation only: GPU shader validation drops draws on the paravirtual device (docs/LOG.md)
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          set -o pipefail
          # 1. the depth-reprojection kernel vs its Rust mirror (core::reproject_motion), known camera move;
          #    exits non-zero on mismatch. Then a full selftest frame through the temporal config.
          ./target/release/fastrender selftest --path forward --upscale temporal --scale 0.5 --size 640x400 --props 20000 | tee temporal-selftest.txt
          grep -q "motion-vector selftest: PASS" temporal-selftest.txt
          # the frame still renders (output not blank)
          grep "3 frame: output" temporal-selftest.txt | grep -v "mean rgba = 0 0 0 0"
          # 2. screenshots with --upscale temporal (city forward, three.js). Where the device lacks the
          #    temporal scaler (this runner) the renderer must say so and fall back to MetalFX spatial.
          ./target/release/fastrender bench --path forward --upscale temporal --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --props 60000 --lights 16 --shot shot-forward-temporal.png | tee temporal-bench.txt
          ./target/release/fastrender bench --three js/dist/three-city.js --upscale temporal --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --shot shot-three-temporal.png > three-temporal.txt 2>&1 || { bash .github/annotate.sh error "three temporal bench" three-temporal.txt 40; exit 1; }
          cat three-temporal.txt | tee -a temporal-bench.txt
          test -s shot-forward-temporal.png && test -s shot-three-temporal.png
          if ./target/release/fastrender probe | grep -q "metalfx_temporal: false"; then
            grep -q "MetalFX temporal scaler not supported on this device: falling back to MetalFX spatial" temporal-bench.txt
            grep -q "MetalFX temporal scaler not supported on this device: falling back to MetalFX spatial" temporal-selftest.txt
            echo "temporal unsupported here: fallback to spatial logged, frames rendered"
          else
            echo "temporal scaler supported: ran MetalFX temporal"
          fi
      - name: API-validation run + screenshots
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          ./target/release/fastrender bench --path forward --upscale metalfx --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --props 60000 --lights 16 --shot shot-forward-metalfx.png
          ./target/release/fastrender bench --path forward --upscale bilinear --scale 1 --size 1280x800 --frames 40 --warmup 5 --props 60000 --shot shot-forward-native.png
          ./target/release/fastrender bench --path deferred --size 1280x800 --frames 40 --warmup 5 --shot shot-deferred.png || true
          ./target/release/fastrender bench --scene voxel --path forward --upscale metalfx --scale 0.5 --size 1280x800 --frames 40 --warmup 5 --lights 16 --shot shot-voxel-metalfx.png
          ./target/release/fastrender bench --scene voxel --path forward --upscale bilinear --scale 1 --size 1280x800 --frames 40 --warmup 5 --shot shot-voxel-native.png
          ./target/release/fastrender bench --three js/dist/three-city.js --upscale metalfx --scale 0.5 --size 1280x800 --frames 60 --warmup 5 --shot shot-three-city.png
          ./target/release/fastrender bench --three js/dist/three-city.js --upscale bilinear --scale 1 --size 1280x800 --frames 60 --warmup 5 --shot shot-three-city-native.png
          ./target/release/fastrender bench --script js/examples/boxes.js --props 20000 --path forward --upscale metalfx --scale 0.5 --size 1280x800 --frames 60 --warmup 5 --shot shot-script.png
      # golden images: native vs the browser three.js r187 reference (same scene/time/size). Both lines print one
      # JSON line and go into the step summary; the last step fails when three's own programs miss the target.
      - name: golden native path (hand-written fs_three, programs native)
        if: always()
        run: |
          set -o pipefail
          ./target/release/fastrender bench --three js/dist/three-city.js --programs native --time 1 --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 2 --shot golden-native-t1.png
          node js/golden/diff.mjs js/golden/ref-t1.png golden-native-t1.png golden-diff-native-t1.png | tee golden-native.json
          echo "golden native path (fs_three): $(cat golden-native.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=golden native path (fs_three)::$(cat golden-native.json)"
      - name: golden three-programs (three.js's own shaders)
        if: always()
        run: |
          set -o pipefail
          rc=0; ./target/release/fastrender bench --three js/dist/three-city.js --programs three --time 1 --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 2 --shot golden-three-t1.png > golden-three-bench.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "golden three-programs bench (exit $rc)" golden-three-bench.txt 30
          [ "$rc" = 0 ]
          node js/golden/diff.mjs js/golden/ref-t1.png golden-three-t1.png golden-diff-three-t1.png | tee golden-three.json
          echo "golden three-programs: $(cat golden-three.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=golden three-programs::$(cat golden-three.json)"
          grep "three frame cost\|three programs:" golden-three-bench.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: golden three-programs MAE<4
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<4?0:1)"
      - name: golden three-programs MAE<2.2
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<2.2?0:1)"
      - name: golden three-programs MAE<1.5
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<1.5?0:1)"
      - name: golden three-programs MAE<1.0
        if: always()
        run: node -e "const r=JSON.parse(require('fs').readFileSync('golden-three.json','utf8'));console.log('MAE',r.mae);process.exit(r.mae<1.0?0:1)"
      # parity scene (js/examples/parity-scene.mjs): every shadow-casting light kind (2 directional, spot, point cube),
      # casters through three's own depth programs (alphaTest cut-out, skinned, morphed), flat shading, wireframe, a
      # tangent-less normal map, instancing; and the same with VSMShadowMap (three's VSM blur programs)
      - name: parity scene renders (selftest, Metal API validation)
        if: always()
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          set -o pipefail
          node js/build.mjs js/examples/parity-scene.entry.mjs js/dist/parity.js
          node js/build.mjs js/examples/parity-scene-vsm.entry.mjs js/dist/parity-vsm.js
          node js/build.mjs js/examples/parity-scene-basic.entry.mjs js/dist/parity-basic.js
          rc=0; ./target/release/fastrender selftest --three js/dist/parity.js --upscale bilinear --scale 1 --size 640x400 > parity-selftest.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "parity selftest (exit $rc)" parity-selftest.txt 25
          rc2=0; ./target/release/fastrender selftest --three js/dist/parity-vsm.js --upscale bilinear --scale 1 --size 640x400 > parity-vsm-selftest.txt 2>&1 || rc2=$?
          bash .github/annotate.sh notice "parity VSM selftest (exit $rc2)" parity-vsm-selftest.txt 25
          grep -q "three-programs selftest: PASS" parity-selftest.txt
          rc3=0; ./target/release/fastrender selftest --three js/dist/parity-basic.js --upscale bilinear --scale 1 --size 640x400 > parity-basic-selftest.txt 2>&1 || rc3=$?
          bash .github/annotate.sh notice "parity Basic selftest (exit $rc3)" parity-basic-selftest.txt 25
          grep -q "three-programs selftest: PASS" parity-vsm-selftest.txt
          grep -q "three-programs selftest: PASS" parity-basic-selftest.txt
      - name: golden parity scene (PCF, VSM, Basic shadow maps)
        if: always()
        run: |
          set -o pipefail
          test -s js/dist/parity.js || node js/build.mjs js/examples/parity-scene.entry.mjs js/dist/parity.js
          test -s js/dist/parity-vsm.js || node js/build.mjs js/examples/parity-scene-vsm.entry.mjs js/dist/parity-vsm.js
          test -s js/dist/parity-basic.js || node js/build.mjs js/examples/parity-scene-basic.entry.mjs js/dist/parity-basic.js
          rc=0; ./target/release/fastrender bench --three js/dist/parity.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-parity-t1.png > golden-parity-bench.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "golden parity bench (exit $rc)" golden-parity-bench.txt 20
          rc2=0; ./target/release/fastrender bench --three js/dist/parity-vsm.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-parity-vsm-t1.png > golden-parity-vsm-bench.txt 2>&1 || rc2=$?
          bash .github/annotate.sh notice "golden parity VSM bench (exit $rc2)" golden-parity-vsm-bench.txt 20
          rc3=0; ./target/release/fastrender bench --three js/dist/parity-basic.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-parity-basic-t1.png > golden-parity-basic-bench.txt 2>&1 || rc3=$?
          bash .github/annotate.sh notice "golden parity Basic bench (exit $rc3)" golden-parity-basic-bench.txt 20
          [ "$rc" = 0 ] && [ "$rc2" = 0 ] && [ "$rc3" = 0 ]
          node js/golden/diff.mjs js/golden/ref-parity-t1.png golden-parity-t1.png golden-diff-parity-t1.png | tee golden-parity.json
          node js/golden/diff.mjs js/golden/ref-parity-vsm-t1.png golden-parity-vsm-t1.png golden-diff-parity-vsm-t1.png | tee golden-parity-vsm.json
          node js/golden/diff.mjs js/golden/ref-parity-basic-t1.png golden-parity-basic-t1.png golden-diff-parity-basic-t1.png | tee golden-parity-basic.json
          echo "golden parity: $(cat golden-parity.json), VSM: $(cat golden-parity-vsm.json), Basic: $(cat golden-parity-basic.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=golden parity (Basic)::$(cat golden-parity-basic.json)"
          echo "::notice title=golden parity (PCF)::$(cat golden-parity.json)"
          echo "::notice title=golden parity (VSM)::$(cat golden-parity-vsm.json)"
          grep "three programs:" golden-parity-bench.txt golden-parity-vsm-bench.txt golden-parity-basic-bench.txt >> "$GITHUB_STEP_SUMMARY" || true
      # first run (43694580347): PCF 0.96, VSM 0.84; with every shadow disabled the browser image is 2.51 off
      - name: golden parity MAE<1.5 (PCF, VSM, Basic)
        if: always()
        run: node -e "for(const f of ['golden-parity.json','golden-parity-vsm.json','golden-parity-basic.json']){const r=JSON.parse(require('fs').readFileSync(f,'utf8'));console.log(f,'MAE',r.mae);if(!(r.mae<1.5))process.exit(1)}"
      # render targets and passes (src/mac_targets.rs, docs/PROTOCOL.md "Render targets and passes"): three's own
      # PMREMGenerator (RoomEnvironment -> cube render target -> blur -> GGX-prefiltered mips) lighting PBR spheres, and
      # EffectComposer (RenderPass -> UnrealBloomPass -> OutputPass), every pass three's JS + programs, natively
      - name: render-target programs compile (PMREM, bloom, OutputPass; Apple metal compiler)
        if: always()
        run: |
          (cd js && node --import ./test/three-alias.mjs test/render-targets.test.mjs ../rt-programs)
          for d in ibl bloom; do
            ./target/release/fastrender xlat-dump rt-programs/$d rt-xlat-$d || exit 1
            for f in rt-xlat-$d/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air || exit 1; done
          done
      - name: IBL + bloom scenes render (selftest, Metal API validation)
        if: always()
        env:
          MTL_DEBUG_LAYER: "1"
        run: |
          node js/build.mjs js/examples/ibl-scene.entry.mjs js/dist/ibl.js
          node js/build.mjs js/examples/ibl-bloom.entry.mjs js/dist/ibl-bloom.js
          rc=0; ./target/release/fastrender selftest --three js/dist/ibl.js --upscale bilinear --scale 1 --size 640x400 > ibl-selftest.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "IBL selftest (exit $rc)" ibl-selftest.txt 25
          rc2=0; ./target/release/fastrender selftest --three js/dist/ibl-bloom.js --upscale bilinear --scale 1 --size 640x400 > ibl-bloom-selftest.txt 2>&1 || rc2=$?
          bash .github/annotate.sh notice "IBL bloom selftest (exit $rc2)" ibl-bloom-selftest.txt 25
          # render-target probe (src/mac_targets.rs): the boot frame's passes and every target's mean colour
          FASTRENDER_RT_PROBE=1 ./target/release/fastrender selftest --three js/dist/ibl.js --upscale bilinear --scale 1 --size 640x400 > ibl-probe.txt 2>&1 || true
          grep "rt probe: pass" ibl-probe.txt > ibl-probe-passes.txt || true
          grep "rt probe: rt" ibl-probe.txt > ibl-probe-targets.txt || true
          bash .github/annotate.sh notice "IBL render-target probe: targets (mean RGBA)" ibl-probe-targets.txt 30
          bash .github/annotate.sh notice "IBL render-target probe: passes" ibl-probe-passes.txt 60
          grep -q "three-programs selftest: PASS" ibl-selftest.txt
          grep -q "three-programs selftest: PASS" ibl-bloom-selftest.txt
      - name: golden IBL + bloom (render targets)
        if: always()
        run: |
          set -o pipefail
          test -s js/dist/ibl.js || node js/build.mjs js/examples/ibl-scene.entry.mjs js/dist/ibl.js
          test -s js/dist/ibl-bloom.js || node js/build.mjs js/examples/ibl-bloom.entry.mjs js/dist/ibl-bloom.js
          rc=0; ./target/release/fastrender bench --three js/dist/ibl.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-ibl-t1.png > golden-ibl-bench.txt 2>&1 || rc=$?
          bash .github/annotate.sh notice "golden IBL bench (exit $rc)" golden-ibl-bench.txt 20
          rc2=0; ./target/release/fastrender bench --three js/dist/ibl-bloom.js --time 1 --scale 1 --upscale bilinear --size 960x600 --frames 3 --warmup 2 --shot golden-ibl-bloom-t1.png > golden-ibl-bloom-bench.txt 2>&1 || rc2=$?
          bash .github/annotate.sh notice "golden IBL bloom bench (exit $rc2)" golden-ibl-bloom-bench.txt 20
          node js/golden/diff.mjs js/golden/ref-ibl-t1.png golden-ibl-t1.png golden-diff-ibl-t1.png | tee golden-ibl.json
          node js/golden/diff.mjs js/golden/ref-ibl-bloom-t1.png golden-ibl-bloom-t1.png golden-diff-ibl-bloom-t1.png | tee golden-ibl-bloom.json
          echo "golden IBL: $(cat golden-ibl.json), bloom: $(cat golden-ibl-bloom.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=golden IBL (PMREM)::$(cat golden-ibl.json)"
          echo "::notice title=golden IBL bloom (EffectComposer)::$(cat golden-ibl-bloom.json)"
          grep "three programs:" golden-ibl-bench.txt golden-ibl-bloom-bench.txt >> "$GITHUB_STEP_SUMMARY" || true
      # first native runs (run 43705587015): PMREM 0.10, bloom 0.22
      - name: golden IBL + bloom MAE<1.5 (PMREM, EffectComposer)
        if: always()
        run: node -e "for(const f of ['golden-ibl.json','golden-ibl-bloom.json']){const r=JSON.parse(require('fs').readFileSync(f,'utf8'));console.log(f,'MAE',r.mae);if(!(r.mae<1.5))process.exit(1)}"
      # The backend seam (src/gpu.rs, docs/notes/metal4-port.md). This runner's GPU has no Metal 4, so: asking for
      # Metal 4 falls back to Metal 3 with a log line and renders; and the script the Metal 4 lane (metal4.yml, a
      # self-hosted Apple silicon runner) runs with `metal4` is exercised here with `metal3`: the same selftests
      # and goldens, gated on the same bounds.
      - name: backend seam (--backend metal4 falls back; the Metal 4 lane's golden script on metal3)
        if: always()
        run: |
          ./target/release/fastrender bench --backend metal4 --path forward --upscale bilinear --scale 1 --size 640x400 --frames 5 --warmup 2 --props 20000 2>&1 | tee backend-fallback.txt
          grep -q "falling back to metal3" backend-fallback.txt
          grep -q "^backend: metal3" backend-fallback.txt
          FASTRENDER_BACKEND=metal3 ./target/release/fastrender bench --path forward --upscale bilinear --scale 1 --size 640x400 --frames 5 --warmup 2 --props 20000 | grep "^backend: metal3 (requested)"
          rc=0; bash .github/metal4-goldens.sh metal3 || rc=$?
          bash .github/annotate.sh $([ $rc -eq 0 ] && echo notice || echo error) "backend seam: golden script on metal3" metal4-goldens.txt 40
          exit $rc
      - name: hypothesis matrix (paravirtual GPU, timings NOT representative)
        run: |
          ./target/release/fastrender matrix --size 1280x800 --frames 60 --warmup 10 --props 60000 --rounds 1
          ./target/release/fastrender voxel-mesh
          ./target/release/fastrender selftest --scene voxel --path forward --upscale metalfx --scale 0.5 --size 640x400
      # Electron host spike (docs/HOST.md "Spike (Nov 2026)"): never blocks the pipeline (continue-on-error),
      # prints PASS/FAIL lines, writes electron-*.png / electron-*-spike.json into the artifact below.
      - name: electron spike - build addon (napi-rs 3) + Electron 45
        id: electron_build
        if: ${{ !cancelled() }}  # independent of the earlier (non-electron) steps
        continue-on-error: true
        working-directory: host/electron
        run: |
          (cd native && RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup" cargo test --release) || echo "[spike] FAIL native unit tests"
          npm ci
          npm run build
          node scripts/bundle.mjs
          npm test
          ls -la native/*.node
          npx electron --version
      - name: electron spike - Metal view under transparent web contents (subview stacking)
        if: ${{ !cancelled() && steps.electron_build.outcome == 'success' }}
        continue-on-error: true
        working-directory: host/electron
        run: |
          set -o pipefail
          npx electron app/main.js --frames 120 --out "$GITHUB_WORKSPACE" --tag electron-subview --stack subview 2>&1 | tee "$GITHUB_WORKSPACE/electron-subview.log"
          echo "--- summary"; grep -E '^\[spike\] (PASS|FAIL)' "$GITHUB_WORKSPACE/electron-subview.log" || true
      - name: electron spike - fallback stacking (child NSWindow below a transparent parent)
        if: ${{ !cancelled() && steps.electron_build.outcome == 'success' }}
        continue-on-error: true
        working-directory: host/electron
        run: |
          set -o pipefail
          npx electron app/main.js --frames 60 --out "$GITHUB_WORKSPACE" --tag electron-childwindow --stack childwindow 2>&1 | tee "$GITHUB_WORKSPACE/electron-childwindow.log"
          echo "--- summary"; grep -E '^\[spike\] (PASS|FAIL)' "$GITHUB_WORKSPACE/electron-childwindow.log" || true
      - name: electron spike - direct mode (contextIsolation off, no bridge) for the per-call cost comparison
        if: ${{ !cancelled() && steps.electron_build.outcome == 'success' }}
        continue-on-error: true
        working-directory: host/electron
        run: |
          set -o pipefail
          npx electron app/main.js --frames 120 --out "$GITHUB_WORKSPACE" --tag electron-direct --stack subview --isolation off --no-reload 2>&1 | tee "$GITHUB_WORKSPACE/electron-direct.log"
          echo "--- summary"; grep -E '^\[spike\] (PASS|FAIL)' "$GITHUB_WORKSPACE/electron-direct.log" || true
      # A REAL game (cktang88/3d-world-objects + patches/3d-world-objects-000{1,2}: air mode, three r187) natively on our
      # default three (r187) vs its browser golden (docs/notes/real-game-3d-world-objects.md): MAE + unsupported counts.
      - name: real game 3d-world-objects - native vs browser golden (MAE gated in the next step)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          MTL_DEBUG_LAYER: "1"  # Metal API validation (the paravirtual GPU: no shader validation)
        run: |
          # the game at the commit patches/3d-world-objects-000{1,2} were made on (upstream has moved on: they do not
          # apply to its HEAD), then the patches: air mode + three r187. Pinned, so the golden stays comparable.
          WO_BASE=073aa9eae0ba86cecb16970162593281714214e3
          if ! { git init -q ../3d-world-objects && git -C ../3d-world-objects fetch -q --depth 1 https://github.com/cktang88/3d-world-objects "$WO_BASE" && git -C ../3d-world-objects checkout -q FETCH_HEAD; } > wo-clone.txt 2>&1; then
            echo "game repo not readable from this job: skipped"; touch wo-skipped; bash .github/annotate.sh warning "world-objects: skipped (fetch failed)" wo-clone.txt 5; exit 0
          fi
          for p in patches/3d-world-objects-000*.patch; do
            git -C ../3d-world-objects -c user.name=ci -c user.email=ci@localhost am -q "$PWD/$p" || { echo "::error title=world-objects::$p does not apply"; exit 1; }
          done
          git -C ../3d-world-objects log --oneline -3
          node js/examples/world-objects.build.mjs ../3d-world-objects js/dist/world-objects.js --target jsc --three three
          rc=0; FASTRENDER_ASSETS="$PWD/../3d-world-objects/public" ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 11 --shot golden-native-world-objects.png > world-objects-bench.txt 2>&1 || rc=$?
          grep -E "world-objects:|three frame cost|three programs:|error|Error" world-objects-bench.txt | cut -c1-1500 | tee world-objects-summary.txt
          bash .github/annotate.sh notice "world-objects bench (exit $rc)" world-objects-summary.txt 20
          grep -v "ERR_FAILED\|fetch blocked" world-objects-bench.txt > world-objects-tail.txt; bash .github/annotate.sh notice "world-objects bench log tail" world-objects-tail.txt 45
          if [ "$rc" != 0 ]; then  # bisect a crash: without the game's files (no models / images), then with a few draws only
            rc2=0; ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 11 > wo-noassets.txt 2>&1 || rc2=$?
            bash .github/annotate.sh notice "world-objects without assets (exit $rc2)" wo-noassets.txt 25
            rc3=0; FASTRENDER_V3_MAX_DRAWS=1 FASTRENDER_ASSETS="$PWD/../3d-world-objects/public" ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 11 > wo-maxdraws.txt 2>&1 || rc3=$?
            bash .github/annotate.sh notice "world-objects 1 draw (exit $rc3)" wo-maxdraws.txt 25
            FASTRENDER_ASSETS="$PWD/../3d-world-objects/public" lldb --batch -o run -k "thread backtrace 25" -k quit -- ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 3 --warmup 11 > wo-lldb.txt 2>&1 || true
            grep -A40 "stop reason\|frame #0" wo-lldb.txt | head -60 > wo-bt.txt; bash .github/annotate.sh notice "world-objects crash backtrace" wo-bt.txt 60
          fi
          node js/golden/diff.mjs js/golden/world-objects-ref.png golden-native-world-objects.png golden-diff-world-objects.png | tee world-objects-golden.json
          echo "::notice title=world-objects golden (MAE vs browser, r187)::$(cat world-objects-golden.json)"
          { echo "world-objects golden: $(cat world-objects-golden.json)"; cat world-objects-summary.txt; } >> "$GITHUB_STEP_SUMMARY"
          # per-frame costs once the level has streamed in (no API validation; the paravirtual GPU's ms are not an Air's)
          rc4=0; env -u MTL_DEBUG_LAYER FASTRENDER_ASSETS="$PWD/../3d-world-objects/public" ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 30 --warmup 60 > world-objects-cost.txt 2>&1 || rc4=$?
          grep -E "world-objects:|three frame cost|three programs:|fps" world-objects-cost.txt | cut -c1-1500 > world-objects-cost-summary.txt
          bash .github/annotate.sh notice "world-objects per-frame cost, frames 61-90 (exit $rc4)" world-objects-cost-summary.txt 20
          # GPU cost A/B (docs/notes/gpu-cost.md): the frame with the game's dark padding lights in every lit fragment
          # (alllights = trimLights off, as WebGLRenderer draws it) vs what ships, and discarding draws in state order
          # (@512) vs last, instanced draws whole (@2048) vs split into the runs in view; paravirtual GPU, so only the ratios mean anything. Twice each, interleaved.
          : > world-objects-gpu-ab.txt
          for a in alllights none none@512 none@2048 alllights none none@512 none@2048; do
            FASTRENDER_V3_DEBUG="$( [ "${a#*@}" != "$a" ] && echo "${a#*@}" || echo 0 )" FASTRENDER_ABLATE="${a%@*}" env -u MTL_DEBUG_LAYER FASTRENDER_ASSETS="$PWD/../3d-world-objects/public" ./target/release/fastrender bench --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 40 --warmup 80 --gpu-passes 1 > "wo-ab-$a.txt" 2>&1 || true
            { echo "== $a"; grep -E "gpu passes|three frame cost|draws per pass" "wo-ab-$a.txt" | cut -c1-400; } >> world-objects-gpu-ab.txt
          done
          grep -F "[census]" wo-ab-none.txt | cut -c1-260 | head -12 >> world-objects-gpu-ab.txt || true
          bash .github/annotate.sh notice "world-objects GPU cost A/B (alllights = before trimLights, none = now, @512 = discard draws in state order, @2048 = instanced draws not split)" world-objects-gpu-ab.txt 40
      # WP3 (docs/research/perf-audit-2026-11.md): async compile on workers, persisted pipeline manifest + prewarm,
      # MTLBinaryArchive. Seven launches per scene (.github/compile-launch.sh): the old behaviour (blocking, one
      # worker, nothing persisted), blocking and async cold, async warm with / without the archive and with / without
      # the OS's own Metal shader cache. Paravirtual GPU: compile times are a real compiler's, GPU times are not.
      - name: compile pipeline - cold vs warm launch (three-city, 3d-world-objects)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          bash .github/compile-launch.sh city --three js/dist/three-city.js --scale 1 --upscale bilinear --size 1280x800 --frames 120 --warmup 0 --seconds 6
          bash .github/annotate.sh notice "compile launch: three-city (ms since renderer init)" compile-launch-city.txt 30
          if [ -f wo-skipped ] || [ ! -f js/dist/world-objects.js ]; then echo "game not fetched: skipped"; exit 0; fi
          export FASTRENDER_ASSETS="$PWD/../3d-world-objects/public"
          bash .github/compile-launch.sh world --three js/dist/world-objects.js --scale 1 --upscale bilinear --size 1280x800 --frames 30 --warmup 60
          bash .github/annotate.sh notice "compile launch: 3d-world-objects (ms since renderer init)" compile-launch-world.txt 30
          { echo '### compile launch (WP3)'; echo '```'; cat compile-launch-city.txt compile-launch-world.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # gate (15 Nov, r187 + patches): MAE 50.5 (run 43706682669) -> 6.58 (run 43711350656: zero-initialised locals,
      # scene.environmentIntensity, synchronous WebAssembly in JSC). The rest: canvas-painted textures in JSC (tree
      # leaves, signs, paving), a few car / crowd details. A regression guard: tighten as those land.
      - name: real game 3d-world-objects MAE<10
        if: ${{ !cancelled() }}
        run: |
          test -f wo-skipped && { echo "game not fetched: skipped"; exit 0; }
          node -e "const r=JSON.parse(require('fs').readFileSync('world-objects-golden.json','utf8'));console.log('world-objects MAE',r.mae);if(!(r.mae<10))process.exit(1)"
      - name: real game 3d-world-objects - every program translates (src/xlat.rs) and compiles (Apple metal)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          test -d ../3d-world-objects || { echo "no game checkout: skipped"; exit 0; }
          # every program the game compiles, dumped by the node run (mock host, glslang CLI) -> xlat-dump -> metal
          (cd js && node test/world-objects.node.mjs "$GITHUB_WORKSPACE/../3d-world-objects" --three three --frames 3 --dump-programs "$GITHUB_WORKSPACE/wo-programs" > "$GITHUB_WORKSPACE/wo-node.txt" 2>&1) || true
          ls wo-programs/*.glsl > /dev/null 2>&1 || { tail -40 wo-node.txt > wo-node-tail.txt; bash .github/annotate.sh error "world-objects node run dumped no programs" wo-node-tail.txt 40; exit 1; }
          ./target/release/fastrender xlat-dump wo-programs wo-xlat > wo-xlat.txt 2>&1 || true
          for f in wo-xlat/*.metal; do xcrun -sdk macosx metal -std=metal3.0 -c "$f" -o /tmp/x.air >> wo-metal.txt 2>&1 || echo "METAL FAIL $f" >> wo-xlat.txt; done
          echo "world-objects: $(grep 'programs translated' wo-xlat.txt), $(grep -c '^METAL FAIL' wo-xlat.txt) fail Apple metal; node: $(grep -c 'program failed' wo-node.txt) failed in the mock host" | tee wo-xlat-summary.txt
          grep "^FAIL\|^METAL FAIL" wo-xlat.txt | head -30 >> wo-xlat-summary.txt || true
          bash .github/annotate.sh notice "world-objects programs (xlat + metal)" wo-xlat-summary.txt 32
          cat wo-xlat-summary.txt >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "^FAIL\|^METAL FAIL" wo-xlat.txt
      # WP10 (docs/notes/half-precision.md): three's lighting functions in 16-bit float, off by default. Per mode
      # (--half brdf|lit|all): every fragment program compiles with Apple's compiler, golden MAE, GPU ms (paravirtual).
      - name: half precision (WP10) - compile, goldens, GPU ms per mode
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          rc=0; bash .github/half-precision.sh > half-precision.log 2>&1 || rc=$?
          head -40 half-precision.txt > half-precision-1.txt; tail -n +41 half-precision.txt > half-precision-2.txt
          bash .github/annotate.sh notice "half precision 1/2 (${{ matrix.os }}, exit $rc)" half-precision-1.txt 40
          bash .github/annotate.sh notice "half precision 2/2 (${{ matrix.os }}, exit $rc)" half-precision-2.txt 40
          [ -s half-metal-errors.txt ] && bash .github/annotate.sh error "half precision: Apple metal errors" half-metal-errors.txt 40
          { echo '### half precision (WP10)'; echo '```'; cat half-precision.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ]
      # Electron host with the REAL renderer (docs/HOST.md "Electron host"): the game runs in the renderer process (V8, real
      # DOM / 2D canvas), the addon's main-process render thread runs fastrender's Metal renderer under the web contents.
      # Screenshot = screencapture of the window (the Metal layer is not in capturePage), diffed like the JSC goldens.
      - name: electron fastrender - three-city (golden vs ref-t1) and 3d-world-objects (golden vs world-objects-ref)
        if: ${{ !cancelled() && steps.electron_build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          MTL_DEBUG_LAYER: "1"
          # goldens: every program / pipeline is waited for where it is first needed (src/mac_programs.rs); the
          # shipped default is async (draws whose pipeline is still compiling are skipped for a frame)
          FASTRENDER_COMPILE: blocking
        run: |
          set -o pipefail
          W=""; test -d ../3d-world-objects && W="--world $GITHUB_WORKSPACE/../3d-world-objects"
          (cd host/electron && node scripts/bundle-game.mjs $W)
          rc=0; (cd host/electron && npx electron game/main.js --kind city --out "$GITHUB_WORKSPACE" --tag electron-city --timeout 300) > electron-city.log 2>&1 || rc=$?
          grep -v "^\[page\] \[fr\] program" electron-city.log | tail -40 > electron-city-tail.txt; bash .github/annotate.sh notice "electron three-city (exit $rc)" electron-city-tail.txt 40
          if [ -f electron-city-golden.png ]; then
            node js/golden/diff.mjs js/golden/ref-t1.png electron-city-golden.png golden-diff-electron-city.png | tee electron-city-golden.json
            node -e "const r=require('./electron-city.json');console.log(JSON.stringify({golden:require('./electron-city-golden.json'),cost:r.cost,draws:r.stats&&r.stats.lastDrawCount,programs:r.programs,xlat:r.xlat,unsupported:r.unsupported,captures:r.captures}))" > electron-city-summary.txt || true
            echo "::notice title=electron three-city golden (MAE vs ref-t1; JSC host: 0.97)::$(cat electron-city-summary.txt | cut -c1-1500)"
            echo "electron three-city: $(cat electron-city-summary.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          test -d ../3d-world-objects || { echo "no game checkout: world skipped"; exit 0; }
          # API validation logs instead of aborting here (MTL_DEBUG_LAYER_ERROR_MODE=nslog): the problems are listed below
          rc=0; (cd host/electron && MTL_DEBUG_LAYER_ERROR_MODE=nslog npx electron game/main.js --kind world --html "$GITHUB_WORKSPACE/../3d-world-objects/index.html" --assets "$GITHUB_WORKSPACE/../3d-world-objects/public" --out "$GITHUB_WORKSPACE" --tag electron-world --timeout 900) > electron-world.log 2>&1 || rc=$?
          grep -v "Security Policy\|Fetch API cannot\|ERR_BLOCKED\|failed assertion\|Validation" electron-world.log | tail -60 > electron-world-tail.txt; bash .github/annotate.sh notice "electron world-objects (exit $rc)" electron-world-tail.txt 60
          grep -A3 "failed assertion\|Validation" electron-world.log | grep -v "Validation Enabled" | sort | uniq -c | sort -rn | head -30 > electron-world-validation.txt || true
          test -s electron-world-validation.txt && bash .github/annotate.sh warning "electron world-objects: Metal API validation" electron-world-validation.txt 30
          if [ -f electron-world-golden.png ]; then
            node js/golden/diff.mjs js/golden/world-objects-ref.png electron-world-golden.png golden-diff-electron-world.png | tee electron-world-golden.json
            node -e "const r=require('./electron-world.json');console.log(JSON.stringify({golden:require('./electron-world-golden.json'),boot_s:r.boot_s,cost:r.cost,golden_frames_js_ms:r.golden_frames_js_ms,draws:r.draws,programs:r.programs,xlat:r.xlat,images:r.images,net:r.net,requests:r.requests,gpu_errors:r.stats&&r.stats.gpuErrors,unsupported:r.unsupported}))" > electron-world-summary.txt || true
            echo "::notice title=electron world-objects golden (MAE vs browser; JSC host 46.9)::$(cat electron-world-summary.txt | cut -c1-2500)"
            echo "electron world-objects: $(cat electron-world-summary.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # per-frame costs without API validation, contextIsolation off (direct addon calls: no bridge copies)
          rc=0; (cd host/electron && env -u MTL_DEBUG_LAYER npx electron game/main.js --kind world --isolation off --html "$GITHUB_WORKSPACE/../3d-world-objects/index.html" --assets "$GITHUB_WORKSPACE/../3d-world-objects/public" --out "$GITHUB_WORKSPACE" --tag electron-world-direct --cost-frames 60 --timeout 900) > electron-world-direct.log 2>&1 || rc=$?
          node -e "const r=require('./electron-world-direct.json');console.log(JSON.stringify({exit:$rc,cost:r.cost,boot_s:r.boot_s,images:r.images,error:r.error}))" > electron-world-direct-summary.txt 2>&1 || tail -20 electron-world-direct.log > electron-world-direct-summary.txt
          bash .github/annotate.sh notice "electron world-objects costs, isolation off, no API validation" electron-world-direct-summary.txt 20
      # gates (first stable run 43712475017: city 0.97 = the JSC host's, world-objects 2.96 vs the JSC host's 6.58)
      - name: electron fastrender three-city MAE<1.0, 3d-world-objects MAE<10
        if: ${{ !cancelled() }}
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('electron-city-golden.json','utf8'));console.log('electron three-city MAE',r.mae);if(!(r.mae<1.0))process.exit(1)"
          test -d ../3d-world-objects || { echo "no game checkout: world gate skipped"; exit 0; }
          node -e "const r=JSON.parse(require('fs').readFileSync('electron-world-golden.json','utf8'));console.log('electron world-objects MAE',r.mae);if(!(r.mae<10))process.exit(1)"
      # Frame loop (docs/LOG.md "frame loop: QoS, fence, per-pass GPU ms..."): frames in flight, slot / drawable waits,
      # per-pass GPU ms, the shared-event fence, the windowed app's pacing (CAMetalDisplayLink or the nextDrawable
      # loop), framebufferOnly, the thermal policy; the split / event-fenced frame must equal the plain one.
      - name: frame loop - frames in flight, per-pass GPU ms, shared-event fence, windowed pacing
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: |
          rc=0; bash .github/frame-loop.sh > frame-loop.log 2>&1 || rc=$?
          head -45 frame-loop.txt > frame-loop-1.txt; tail -n +46 frame-loop.txt > frame-loop-2.txt
          bash .github/annotate.sh notice "frame loop 1/2 (${{ matrix.os }}, exit $rc)" frame-loop-1.txt 45
          bash .github/annotate.sh notice "frame loop 2/2 (${{ matrix.os }}, exit $rc)" frame-loop-2.txt 60
          { echo '```'; cat frame-loop.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ]
      - name: Game Mode keys - the binary's embedded Info.plist, the Electron app bundle
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          otool -s __TEXT __info_plist target/release/fastrender | head -3
          strings target/release/fastrender | grep -A1 "LSSupportsGameMode\|LSApplicationCategoryType" | head -6
          if [ -d host/electron/node_modules/electron ]; then
            (cd host/electron && node scripts/game-mode.mjs && npx electron --version) 2>&1 | tee game-mode.txt
            bash .github/annotate.sh notice "Game Mode keys (Electron.app)" game-mode.txt 5
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            *.png
            bench-results.json
            electron-*-spike.json
            electron-*.json
            electron-*.log
            frame-loop*.txt
            half-precision*.txt
            half-metal*.txt
            frame-loop.log

  # Why is the real game's JS 3-4x slower in the JavaScriptCore host than in Electron / node on this runner? The JS
  # alone (`fastrender jsbench`, no Metal) under JSC_* options and code-signing variants, vs node (V8) and bun (its own
  # JavaScriptCore) on the same bundle. Non-gating, results as annotations. docs/research/jsc-vs-v8.md
  jsc-profile:
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 75
    env:
      WO_BUNDLE: js/dist/world-objects.js
    steps:
      - uses: actions/checkout@v7
      - name: build + the game's JavaScriptCore bundle
        run: |
          brew install glslang spirv-cross
          cargo build --release
          (cd js && npm ci --silent)
          WO_BASE=073aa9eae0ba86cecb16970162593281714214e3
          git init -q ../3d-world-objects && git -C ../3d-world-objects fetch -q --depth 1 https://github.com/cktang88/3d-world-objects "$WO_BASE" && git -C ../3d-world-objects checkout -q FETCH_HEAD
          for p in patches/3d-world-objects-000*.patch; do git -C ../3d-world-objects -c user.name=ci -c user.email=ci@localhost am -q "$PWD/$p"; done
          node js/examples/world-objects.build.mjs ../3d-world-objects $WO_BUNDLE --target jsc --three three
      - name: JS ms/frame per JIT tier (system JavaScriptCore, JSC_* options)
        timeout-minutes: 30
        run: |
          bash .github/jsc-profile.sh tiers $WO_BUNDLE "$GITHUB_WORKSPACE/../3d-world-objects"
          bash .github/annotate.sh notice "jsc-profile tiers" jsc-profile/summary-tiers.txt 40
          bash .github/annotate.sh notice "jsc-profile frame windows" jsc-profile/windows.txt 40
      - name: JS ms/frame per code signature (ad hoc, hardened runtime, allow-jit entitlement)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          bash .github/jsc-profile.sh signing $WO_BUNDLE "$GITHUB_WORKSPACE/../3d-world-objects"
          bash .github/annotate.sh notice "jsc-profile signing" jsc-profile/summary-signing.txt 40
      - name: same bundle in node (V8) and bun (its own JavaScriptCore)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: |
          bash .github/jsc-profile.sh engines $WO_BUNDLE "$GITHUB_WORKSPACE/../3d-world-objects"
          bash .github/annotate.sh notice "jsc-profile engines" jsc-profile/summary-engines.txt 40
      - name: with Metal (bench --three)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          bash .github/jsc-profile.sh metal $WO_BUNDLE "$GITHUB_WORKSPACE/../3d-world-objects"
          bash .github/annotate.sh notice "jsc-profile metal" jsc-profile/summary-metal.txt 40
      - name: options, compiles per tier, GC, sampling profiler
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          bash .github/jsc-profile.sh diagnostics $WO_BUNDLE "$GITHUB_WORKSPACE/../3d-world-objects"
          bash .github/annotate.sh notice "jsc-profile diagnostics" jsc-profile/summary-diagnostics.txt 40
          bash .github/annotate.sh notice "jsc-profile sampling profiler" jsc-profile/sampling-top.txt 60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jsc-profile
          path: |
            jsc-profile/*.txt
            jsc-profile/*.out
            jsc-profile/*.err
            jsc-profile/*.json
            jsc-profile/sampling

  # "Why not just three's WebGPURenderer?" measured (docs/research/webgpu-vs-fastrender.md): the same scenes on stock
  # three WebGLRenderer (ANGLE -> Metal), stock three WebGPURenderer (Dawn -> Metal) and fastrender, in ONE Electron
  # app (host/electron/game/bench-main.js), by the one-command script users run on their own Mac.
  # A separate job: it takes ~25 minutes and must not delay the pipeline above. Never fails the workflow.
  # !!! THE RUNNER'S GPU IS PARAVIRTUAL: fps and GPU ms here are NOT representative of an M2 Air. The CPU-side columns
  # !!! (JS ms per frame, CPU ms per frame per process) are the informative part; run the script on real hardware.
  # It takes a runner for ~45 minutes, so it does NOT run on every push: only when the head commit's message mentions
  # "bench-3way", or on a manual run (workflow_dispatch).
  bench-3way:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'bench-3way') }}
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - name: bench-3way - WebGLRenderer vs WebGPURenderer vs fastrender (PARAVIRTUAL GPU - absolute numbers are not an Air's)
        continue-on-error: true
        timeout-minutes: 60
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string
          rc=0; bash host/electron/scripts/bench-3way.sh --ci --out "$GITHUB_WORKSPACE/bench-out" > bench-3way.log 2>&1 || rc=$?
          echo "bench-3way.sh exit $rc"; tail -60 bench-3way.log
      # its own step: a run that hangs must not cost the runs that finished
      - name: bench-3way - report (job summary + annotations)
        if: always()
        continue-on-error: true
        run: |
          NOTE="GitHub macos-26 runner, PARAVIRTUAL GPU: fps and GPU ms are NOT an M2 Air's; compare the CPU-side columns. $(sysctl -n machdep.cpu.brand_string)"
          grep -A200 "== runs" bench-3way.log | grep -v "^\s*$" | head -70 > bench-3way-runs.txt || true
          bash .github/annotate.sh notice "bench-3way run log" bench-3way-runs.txt 70
          if ls bench-out/bench-*.json > /dev/null 2>&1; then
            (cd host/electron && node scripts/bench-3way.report.mjs "$GITHUB_WORKSPACE/bench-out" --annotate --note "$NOTE")
            cat bench-out/bench-3way.md >> "$GITHUB_STEP_SUMMARY"
          else
            tail -40 bench-3way.log > bench-3way-tail.txt; bash .github/annotate.sh error "bench-3way produced no runs" bench-3way-tail.txt 40
          fi
          # failed runs: what Chromium / the page said (GitHub keeps 10 warnings per step)
          for j in bench-out/bench-*.json; do
            [ "$(basename "$j")" = bench-3way.json ] && continue
            node -e "process.exit(JSON.parse(require('fs').readFileSync('$j','utf8')).ok?0:1)" 2>/dev/null && continue
            grep -v "ERR_FAILED\|ERR_BLOCKED\|Security Policy\|Fetch API cannot" "${j%.json}.log" | tail -25 > bench-fail.txt; bash .github/annotate.sh warning "bench-3way failed run: $(basename "$j" .json)" bench-fail.txt 25
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-3way
          path: |
            bench-out/
            bench-3way.log
