[package]
name = "fastrender"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.34.3"
glslang = "0.9.1"
glslang-sys = "0.9.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] } # src/image.rs: __fr.decodeImage for real games
png = "0.18.1"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spirv-cross2 = { version = "0.7.2", default-features = false, features = ["msl"] }
voxel-core = { git = "https://github.com/cktang88/voxel-castle-defense", rev = "9c77553beb8543b42382b2bb70b964806e852178", version = "0.1.0" }
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-metal-fx = "0.3.2"
objc2-quartz-core = "0.3.2"

# glslang + SPIRV-Cross are C++ built by the -sys crates' build scripts; keep them optimised in debug/test builds too
# (an -O0 glslang makes every translation several times slower).
[profile.dev.package.glslang-sys]
opt-level = 3
[profile.dev.package.spirv-cross-sys]
opt-level = 3
