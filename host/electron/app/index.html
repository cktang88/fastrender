<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fastrender electron spike</title>
<style>
  /* Everything transparent: the Metal view underneath must show through wherever the DOM is empty. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.3 -apple-system, sans-serif; }
  /* An OPAQUE magenta panel: if the Metal view were stacked above the DOM, this would be covered. */
  #hud { position: absolute; left: 16px; top: 16px; width: 240px; height: 96px; background: #ff00ff; color: #000; padding: 8px; box-sizing: border-box; }
  #hud button { position: absolute; left: 8px; top: 56px; width: 80px; height: 24px; }
  #hud pre { margin: 0; font: 12px/1.3 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
  <div id="hud"><pre id="txt">starting</pre><button id="btn">click</button></div>
  <script src="renderer.js"></script>
  <script src="dist/game.js"></script>
</body>
</html>
